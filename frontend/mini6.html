<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Challenge #6</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="flex justify-evenly bg-blue-500 font-bold text-white shadow-lg">
        <a href="index.html" class="text-[30px] lg:text-[48px] flex py-12">&lt;</a>
        <p class="text-[30px] lg:text-[48px] text-shadow-lg flex justify-center py-12">Mini Challenge #6: Mad Lib</p>
        <p class="text-[48px] text-shadow-lg flex py-12"></p>
    </header>

    <section>
        <form class="mt-25" id="madlib-form">
            <div class="flex flex-col justify-evenly">
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Color:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-1" placeholder="blue" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Adjective:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-2" placeholder="toasty" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Time:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-3" placeholder="6:00" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Adjective:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-4" placeholder="toasty" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Place:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-5" placeholder="DisneyLand" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Food:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-6" placeholder="pizza" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Food:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-7" placeholder="pizza" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Verb:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-8" placeholder="run" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Noun:</p>
                    <input class="text-[20px] border bg-gray-300" type="text" id="word-9" placeholder="apple" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[20px]">Number:</p>
                    <input class="text-[20px] border bg-gray-300" type="number" id="word-10" placeholder="10" required>
                </div>
            </div>
            <div class="flex justify-center ">
                <button class="text-[24px] mt-4 border">Mad Lib</button>
            </div>
        </form>
        <p class="text-[24px] font-bold flex justify-center mt-8 p-10" id="madlib-output"></p>
    </section>
    <script src="./js/app.js"></script>
</body>

</html>
