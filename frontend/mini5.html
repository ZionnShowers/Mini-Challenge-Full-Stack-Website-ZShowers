<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Challenge #5</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="flex justify-evenly bg-blue-500 font-bold text-white shadow-lg">
        <a href="index.html" class="text-[30px] lg:text-[48px] flex py-12">&lt;</a>
        <p class="text-[30px] lg:text-[48px] text-shadow-lg flex py-12">Mini Challenge #5: Restaurant Picker</p>
        <p class="text-[48px] text-shadow-lg flex py-12"></p>
    </header>

    <section class="flex flex-col items-center">
        <h2 class="text-[32px] mt-12">Pick a restaurant:</h2>
        <p class="text-[20px]">1 - Fast Food | 2 - Casual Dining | 3 - Sitdown</p>
        <form class="flex flex-col" id="rest-form">
            <input class="bg-gray-300 border text-[24px] py-3 px-3 mt-4" type="number" id="number-one" placeholder="1" required>
            <button class="text-[24px] border mt-4">Pick</button>
        </form>

        <p class="text-[40px] font-bold mt-23" id="rest-output"></p>
    </section>
    <script src="./js/app.js"></script>
</body>
</html>
