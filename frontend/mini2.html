<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Challenge #2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="flex justify-evenly bg-blue-500 font-bold text-white shadow-lg">
        <a href="index.html" class="text-[30px] lg:text-[48px] flex py-12">&lt;</a>
        <p class="text-[30px] lg:text-[48px] text-shadow-lg flex justify-center py-12">Mini Challenge #2: Adding Two Numbers</p>
        <p class="text-[48px] text-shadow-lg flex py-12"></p>
    </header>

    <section>
        <form class="mt-25" id="add-form">
            <div class="flex justify-evenly">
                <div class="flex flex-col items-center">
                    <p class="text-[32px]">Input first number:</p>
                    <input class="text-[24px] border bg-gray-300" type="number" id="number-one" placeholder="1" required>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[32px]">Input second number:</p>
                    <input class="text-[24px] border bg-gray-300" type="number" id="number-two" placeholder="2" required>
                </div>
            </div>
            <div class="flex justify-center ">
                <button class="text-[24px] mt-4 border">Add</button>
            </div>
        </form>
        <p class="text-[40px] font-bold flex justify-center mt-49" id="add-output"></p>
    </section>
    <script src="./js/app.js"></script>
</body>

</html>
